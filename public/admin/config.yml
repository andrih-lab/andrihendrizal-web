# Konfigurasi Sveltia/Decap CMS (Bagian 7 dokumen rancang bangun).
# TODO: bila nama branch produksi berubah (mis. setelah dirapikan ke
# "main"), perbarui nilai `branch` di bawah supaya CMS menyimpan ke
# branch yang benar-benar di-deploy Netlify.
backend:
  name: github
  repo: andrih-lab/andrihendrizal-web
  branch: claude/portfolio-website-stage-1-ei9128

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "writing_en"
    label: "Writing (English)"
    folder: "src/content/writing/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description (used in list + RSS)", widget: "text" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "lang", label: "Language", widget: "hidden", default: "en" }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - name: "translationOf"
        label: "Translation of (Indonesian post's filename, no extension)"
        widget: "string"
        required: false
        hint: "Only fill in if this post has a published Indonesian counterpart."
      - name: "draft"
        label: "Draft (unpublished until unchecked)"
        widget: "boolean"
        default: true
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "writing_id"
    label: "Tulisan (Indonesia)"
    folder: "src/content/writing/id"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar + RSS)", widget: "text" }
      - { name: "date", label: "Tanggal", widget: "datetime" }
      - { name: "lang", label: "Bahasa", widget: "hidden", default: "id" }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - { name: "cover", label: "Gambar Sampul", widget: "image", required: false }
      - name: "translationOf"
        label: "Terjemahan dari (nama berkas versi Inggris, tanpa ekstensi)"
        widget: "string"
        required: false
        hint: "Isi hanya bila tulisan ini punya padanan bahasa Inggris yang sudah terbit."
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
      - { name: "body", label: "Isi", widget: "markdown" }

  - name: "courses_en"
    label: "Courses (English)"
    folder: "src/content/courses/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description (used in list)", widget: "text" }
      - { name: "lang", label: "Language", widget: "hidden", default: "en" }
      - name: "access"
        label: "Access"
        widget: "select"
        options: [{ label: "Free — full content lives on this site", value: "free" }, { label: "Paid — teaser only, real content is on an external platform", value: "paid" }]
        default: "free"
      - { name: "price", label: "Price (paid courses only, e.g. \"Rp150,000\")", widget: "string", required: false }
      - name: "purchaseUrl"
        label: "Purchase URL (paid courses only — Gumroad, Payhip, Teachable, etc.)"
        widget: "string"
        required: false
        hint: "Required for paid courses. This site cannot process payment or protect content itself — see the template files for details."
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - name: "draft"
        label: "Draft (unpublished until unchecked)"
        widget: "boolean"
        default: true
      - name: "body"
        label: "Body (full lesson content for FREE courses; public teaser/syllabus only for PAID courses)"
        widget: "markdown"
        hint: "For a free course, you may embed a YouTube video with an <iframe> — see the _template-free.md example file. For a paid course, never paste the real paid content here — it is publicly visible."

  - name: "courses_id"
    label: "Kursus (Indonesia)"
    folder: "src/content/courses/id"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar)", widget: "text" }
      - { name: "lang", label: "Bahasa", widget: "hidden", default: "id" }
      - name: "access"
        label: "Akses"
        widget: "select"
        options: [{ label: "Gratis — isi penuh tampil di situs ini", value: "free" }, { label: "Berbayar — hanya teaser, materi asli di platform luar", value: "paid" }]
        default: "free"
      - { name: "price", label: "Harga (khusus kursus berbayar, mis. \"Rp150.000\")", widget: "string", required: false }
      - name: "purchaseUrl"
        label: "URL Pembelian (khusus kursus berbayar — Gumroad, Payhip, Teachable, dsb.)"
        widget: "string"
        required: false
        hint: "Wajib diisi untuk kursus berbayar. Situs ini tidak bisa memproses pembayaran atau melindungi konten sendiri — lihat berkas templat untuk detail."
      - { name: "cover", label: "Gambar Sampul", widget: "image", required: false }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
      - name: "body"
        label: "Isi (materi pelajaran penuh untuk kursus GRATIS; hanya teaser/silabus publik untuk kursus BERBAYAR)"
        widget: "markdown"
        hint: "Untuk kursus gratis, Anda bisa menyematkan video YouTube dengan <iframe> — lihat contoh di _template-gratis.md. Untuk kursus berbayar, jangan pernah tempel materi asli di sini — akan terlihat oleh siapa saja."

  - name: "santai"
    label: "Santai Sejenak"
    folder: "src/content/santai"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar)", widget: "text" }
      - { name: "date", label: "Tanggal", widget: "datetime" }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: false
      - { name: "body", label: "Isi", widget: "markdown" }

  - name: "books"
    label: "Books"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "year", label: "Year", widget: "number", value_type: "int" }
      - { name: "isbn", label: "ISBN", widget: "string", required: false }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - name: "formats"
        label: "Formats"
        widget: "select"
        multiple: true
        options: ["print", "pdf", "epub"]
        default: []
      - name: "purchaseLinks"
        label: "Where to Buy"
        widget: "list"
        default: []
        hint: "Add one entry per store/format — e.g. one for the print edition, one for the ebook."
        fields:
          - { name: "label", label: "Label (e.g. \"Print — Gramedia\" or \"Ebook — Google Play\")", widget: "string" }
          - { name: "url", label: "URL", widget: "string" }
      - { name: "quote", label: "Reader Quote", widget: "text", required: false }
      - { name: "body", label: "Notes (not shown on site)", widget: "markdown", required: false }

  - name: "library"
    label: "Koleksi Bacaan / Library"
    folder: "src/content/library"
    create: true
    slug: "{{catalogNumber}}-{{slug}}"
    fields:
      # Lebih mudah: jalankan `npm run buku` di Terminal — No. Induk (lanjut dari nomor terakhir)
      # dan Nomor Panggil terisi otomatis. Di CMS, isi manual: pakai nomor berikutnya yang belum dipakai.
      - { name: "catalogNumber", label: "No. Induk / Catalog No. (nomor berikutnya setelah yang terakhir, mis. \"BK-0005\")", widget: "string" }
      - { name: "callNumber", label: "Nomor Panggil / Call No. ([Kelas DDC] [3 huruf pengarang KAPITAL] [1 huruf judul kecil], mis. \"577.699 SRI k\")", widget: "string", required: false }
      - { name: "title", label: "Judul / Title", widget: "string" }
      - { name: "subtitle", label: "Anak Judul / Subtitle", widget: "string", required: false }
      - { name: "author", label: "Pengarang Utama / Author", widget: "string" }
      - { name: "coAuthors", label: "Pengarang/Editor Lain / Co-authors", widget: "string", required: false }
      - { name: "publisher", label: "Penerbit / Publisher", widget: "string", required: false }
      - { name: "year", label: "Tahun Terbit / Year", widget: "number", value_type: "int", required: false }
      - { name: "isbn", label: "ISBN", widget: "string", required: false }
      - { name: "language", label: "Bahasa Buku / Book Language", widget: "select", options: ["Indonesia", "Inggris", "Arab", "Melayu", "Jepang", "Lainnya"], required: false }
      - { name: "pages", label: "Jml Halaman / Pages", widget: "number", value_type: "int", required: false }
      - name: "categories"
        label: "Subjek/Topik / Subject (Kategori)"
        widget: "select"
        multiple: true
        options:
          - "Metodologi Penelitian"
          - "Pengembangan Diri"
          - "Karbon Biru"
          - "Karya umum, komputer, dan informasi"
          - "Pemrograman & perangkat lunak"
          - "Filsafat dan psikologi"
          - "Agama"
          - "Ilmu sosial"
          - "Sumber daya alam & lingkungan hidup"
          - "Ekonomi produksi & pembangunan"
          - "Hukum"
          - "Pendidikan"
          - "Bahasa"
          - "Sains murni"
          - "Statistika"
          - "Lahan basah pesisir & karbon biru"
          - "Biologi umum"
          - "Ekologi"
          - "Ekologi mangrove & estuari"
          - "Tumbuhan (botani)"
          - "Hewan (zoologi)"
          - "Ikan"
          - "Teknologi & ilmu terapan"
          - "Pertanian"
          - "Perikanan tangkap"
          - "Akuakultur"
          - "Konservasi sumber daya hayati"
          - "Kesenian, hiburan, olahraga"
          - "Kesusastraan"
          - "Kesusastraan Indonesia"
          - "Sejarah & geografi"
          - "Geografi, pemetaan, perjalanan"
        default: []
        required: false
        hint: "Pilih dari daftar (sumber: sheet KODE_REFERENSI). Dipakai untuk filter di halaman Koleksi Bacaan. Pilihan baru: tambahkan di sini dan di scripts/library-reference.json."
      - name: "formats"
        label: "Format"
        widget: "select"
        multiple: true
        options: ["cetak", "pdf", "epub", "google-play"]
        default: []
      - { name: "link", label: "Link (Google Play Books, dsb.)", widget: "string", required: false }
      - { name: "cover", label: "Sampul / Cover Image", widget: "image", required: false }
      - name: "status"
        label: "Sudah Dibaca? / Reading Status"
        widget: "select"
        options:
          - { label: "Belum", value: "belum" }
          - { label: "Sedang Dibaca", value: "sedang" }
          - { label: "Sudah", value: "sudah" }
        default: "belum"
      - { name: "rating", label: "Rating (1-5)", widget: "number", value_type: "int", min: 1, max: 5, required: false }
      - name: "draft"
        label: "Draft (unpublished until unchecked) / Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
      - { name: "body", label: "Ringkasan/Kesan Setelah Membaca / Reading Notes", widget: "markdown", required: false }

  - name: "microscopy"
    label: "Microscopy / Mikroskop"
    folder: "src/content/microscopy"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - name: "caption"
        label: "Caption"
        widget: "object"
        fields:
          - { name: "en", label: "English", widget: "string" }
          - { name: "id", label: "Indonesia", widget: "string" }
      - { name: "date", label: "Date / Tanggal", widget: "datetime" }
      - { name: "scientificName", label: "Scientific Name / Nama Ilmiah (optional)", widget: "string", required: false, hint: "e.g. Pandanus amaryllifolius" }
      - { name: "magnification", label: "Magnification / Perbesaran (optional)", widget: "string", required: false, hint: "e.g. 40x" }
      - name: "notes"
        label: "Notes / Catatan Tambahan (optional)"
        widget: "object"
        required: false
        fields:
          - { name: "en", label: "English", widget: "text", required: false }
          - { name: "id", label: "Indonesia", widget: "text", required: false }
      - name: "originalImage"
        label: "Original/Whole Specimen Photo / Foto Asli Spesimen (optional)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Foto spesimen sebelum diperiksa di bawah mikroskop."
      - name: "image"
        label: "Main Microscope Photo / Foto Utama di Bawah Mikroskop (isi ini ATAU video di bawah, bukan dua-duanya)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Foto otomatis dikompres DAN diberi watermark saat situs di-build — tidak perlu dikecilkan atau diberi watermark manual dulu."
      - name: "additionalImages"
        label: "Additional Microscope Photos / Foto Mikroskop Tambahan (optional)"
        widget: "list"
        required: false
        default: []
        field:
          name: "image"
          label: "Photo / Foto"
          widget: "image"
          media_folder: "/public/images/microscopy-uploads"
          public_folder: "/images/microscopy-uploads"
        hint: "Mis. perbesaran atau sudut berbeda dari foto utama."
      - name: "transversalSection"
        label: "Preparat: Sayatan Melintang/Transversal (optional)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Sayatan melintang helaian daun, melewati ibu tulang daun. Paling informatif: memperlihatkan epidermis atas & bawah, kutikula, jaringan palisade & bunga karang, serta berkas pengangkut."
      - name: "paradermalAdaxialSection"
        label: "Preparat: Sayatan Paradermal Permukaan Atas/Adaksial (optional)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Sayatan sejajar permukaan atas daun, untuk melihat bentuk sel epidermis, trikoma, dan stomata jika ada."
      - name: "paradermalAbaxialSection"
        label: "Preparat: Sayatan Paradermal Permukaan Bawah/Abaksial (optional)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Sayatan sejajar permukaan bawah daun. Biasanya stomata paling banyak di sini — bisa dipakai untuk menghitung indeks dan kerapatan stomata."
      - name: "petioleSection"
        label: "Preparat: Sayatan Melintang Tangkai Daun/Petiol (optional)"
        widget: "image"
        required: false
        media_folder: "/public/images/microscopy-uploads"
        public_folder: "/images/microscopy-uploads"
        hint: "Opsional — untuk melihat susunan berkas pengangkut pada tangkai daun."
      - name: "youtubeId"
        label: "YouTube Video ID (isi ini ATAU foto di atas)"
        widget: "string"
        required: false
        hint: "Ambil dari URL video, mis. youtube.com/watch?v=INI_ID_NYA — bisa video 'tidak terdaftar/unlisted' bila tak ingin publik di YouTube."
      - name: "draft"
        label: "Draft (unpublished until unchecked) / Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true

  - name: "herbarium"
    label: "Herbarium"
    folder: "src/content/herbarium"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - name: "title"
        label: "Series Title / Judul Seri"
        widget: "object"
        hint: "e.g. \"Payakumbuh Family Visit\" / mis. \"Kunjungan Keluarga di Payakumbuh\""
        fields:
          - { name: "en", label: "English", widget: "string" }
          - { name: "id", label: "Indonesia", widget: "string" }
      - { name: "location", label: "Location / Lokasi", widget: "string", hint: "e.g. \"Payakumbuh, Sumatera Barat\"" }
      - { name: "date", label: "Date / Tanggal", widget: "datetime" }
      - name: "description"
        label: "Description / Deskripsi (optional)"
        widget: "object"
        required: false
        fields:
          - { name: "en", label: "English", widget: "string", required: false }
          - { name: "id", label: "Indonesia", widget: "string", required: false }
      - name: "categories"
        label: "Categories / Kategori (optional)"
        widget: "list"
        required: false
        default: []
        hint: "Bebas, satu kategori per baris — mis. \"Rumput\", \"Invasive Species\", \"Payakumbuh\". Dipakai untuk badge dan filter pencarian di halaman Herbarium."
      - name: "specimens"
        label: "Specimens / Spesimen"
        widget: "list"
        default: []
        hint: "One entry per plant specimen collected on this trip / Satu entri per spesimen tumbuhan yang dikumpulkan di perjalanan ini."
        fields:
          - { name: "scientificName", label: "Scientific Name / Nama Ilmiah", widget: "string", hint: "e.g. Ficus benjamina" }
          - { name: "localName", label: "Local Name / Nama Daerah", widget: "string", required: false }
          - { name: "family", label: "Family / Famili", widget: "string", required: false, hint: "e.g. Moraceae" }
          - { name: "notes", label: "Notes / Catatan", widget: "text", required: false }
          - name: "wholePlantImage"
            label: "Whole Plant Photo / Foto Tumbuhan Utuh (optional)"
            widget: "image"
            required: false
            media_folder: "/public/images/herbarium-uploads"
            public_folder: "/images/herbarium-uploads"
            hint: "Foto tumbuhan utuh di habitatnya, sebelum dikeringkan/ditekan."
          - name: "image"
            label: "Herbarium/Pressed Specimen Photo / Foto Spesimen Herbarium"
            widget: "image"
            media_folder: "/public/images/herbarium-uploads"
            public_folder: "/images/herbarium-uploads"
            hint: "Foto otomatis dikompres DAN diberi watermark saat situs di-build."
      - name: "draft"
        label: "Draft (unpublished until unchecked) / Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true

  - name: "wetSpecimens"
    label: "Wet Specimens / Awetan Basah"
    folder: "src/content/wet-specimens"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - name: "title"
        label: "Series Title / Judul Seri"
        widget: "object"
        hint: "e.g. \"Mangrove Root Fauna, Pangkalan Jambi\" / mis. \"Fauna Akar Mangrove, Pangkalan Jambi\""
        fields:
          - { name: "en", label: "English", widget: "string" }
          - { name: "id", label: "Indonesia", widget: "string" }
      - { name: "location", label: "Location / Lokasi", widget: "string", hint: "e.g. \"Pangkalan Jambi, Bengkalis, Riau\"" }
      - { name: "date", label: "Date / Tanggal", widget: "datetime" }
      - name: "description"
        label: "Description / Deskripsi (optional)"
        widget: "object"
        required: false
        fields:
          - { name: "en", label: "English", widget: "string", required: false }
          - { name: "id", label: "Indonesia", widget: "string", required: false }
      - name: "specimens"
        label: "Specimens / Spesimen"
        widget: "list"
        default: []
        hint: "One entry per specimen jar/vial from this collecting session / Satu entri per toples/wadah spesimen dari sesi koleksi ini."
        fields:
          - { name: "scientificName", label: "Scientific Name / Nama Ilmiah", widget: "string", hint: "e.g. Cerithidea obtusa" }
          - { name: "localName", label: "Local Name / Nama Daerah", widget: "string", required: false }
          - { name: "family", label: "Family / Famili", widget: "string", required: false, hint: "e.g. Potamididae" }
          - { name: "preservationMethod", label: "Preservation Method / Metode Pengawetan", widget: "string", required: false, hint: "e.g. \"70% ethanol\"" }
          - { name: "notes", label: "Notes / Catatan", widget: "text", required: false }
          - name: "image"
            label: "Specimen Photo / Foto Spesimen"
            widget: "image"
            media_folder: "/public/images/wet-specimen-uploads"
            public_folder: "/images/wet-specimen-uploads"
            hint: "Foto otomatis dikompres DAN diberi watermark saat situs di-build."
      - name: "draft"
        label: "Draft (unpublished until unchecked) / Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
