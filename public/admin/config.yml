# Konfigurasi Sveltia/Decap CMS (Bagian 7 dokumen rancang bangun).
# TODO: bila nama branch produksi berubah (mis. setelah dirapikan ke
# "main"), perbarui nilai `branch` di bawah supaya CMS menyimpan ke
# branch yang benar-benar di-deploy Netlify.
backend:
  name: github
  repo: andrih-lab/andrihendrizal-web
  branch: claude/portfolio-website-stage-1-ei9128

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "writing_en"
    label: "Writing (English)"
    folder: "src/content/writing/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description (used in list + RSS)", widget: "text" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "lang", label: "Language", widget: "hidden", default: "en" }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - name: "translationOf"
        label: "Translation of (Indonesian post's filename, no extension)"
        widget: "string"
        required: false
        hint: "Only fill in if this post has a published Indonesian counterpart."
      - name: "draft"
        label: "Draft (unpublished until unchecked)"
        widget: "boolean"
        default: true
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "writing_id"
    label: "Tulisan (Indonesia)"
    folder: "src/content/writing/id"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar + RSS)", widget: "text" }
      - { name: "date", label: "Tanggal", widget: "datetime" }
      - { name: "lang", label: "Bahasa", widget: "hidden", default: "id" }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - { name: "cover", label: "Gambar Sampul", widget: "image", required: false }
      - name: "translationOf"
        label: "Terjemahan dari (nama berkas versi Inggris, tanpa ekstensi)"
        widget: "string"
        required: false
        hint: "Isi hanya bila tulisan ini punya padanan bahasa Inggris yang sudah terbit."
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
      - { name: "body", label: "Isi", widget: "markdown" }

  - name: "courses_en"
    label: "Courses (English)"
    folder: "src/content/courses/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description (used in list)", widget: "text" }
      - { name: "lang", label: "Language", widget: "hidden", default: "en" }
      - name: "access"
        label: "Access"
        widget: "select"
        options: [{ label: "Free — full content lives on this site", value: "free" }, { label: "Paid — teaser only, real content is on an external platform", value: "paid" }]
        default: "free"
      - { name: "price", label: "Price (paid courses only, e.g. \"Rp150,000\")", widget: "string", required: false }
      - name: "purchaseUrl"
        label: "Purchase URL (paid courses only — Gumroad, Payhip, Teachable, etc.)"
        widget: "string"
        required: false
        hint: "Required for paid courses. This site cannot process payment or protect content itself — see the template files for details."
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - { name: "tags", label: "Tags", widget: "list", default: [] }
      - name: "draft"
        label: "Draft (unpublished until unchecked)"
        widget: "boolean"
        default: true
      - name: "body"
        label: "Body (full lesson content for FREE courses; public teaser/syllabus only for PAID courses)"
        widget: "markdown"
        hint: "For a free course, you may embed a YouTube video with an <iframe> — see the _template-free.md example file. For a paid course, never paste the real paid content here — it is publicly visible."

  - name: "courses_id"
    label: "Kursus (Indonesia)"
    folder: "src/content/courses/id"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar)", widget: "text" }
      - { name: "lang", label: "Bahasa", widget: "hidden", default: "id" }
      - name: "access"
        label: "Akses"
        widget: "select"
        options: [{ label: "Gratis — isi penuh tampil di situs ini", value: "free" }, { label: "Berbayar — hanya teaser, materi asli di platform luar", value: "paid" }]
        default: "free"
      - { name: "price", label: "Harga (khusus kursus berbayar, mis. \"Rp150.000\")", widget: "string", required: false }
      - name: "purchaseUrl"
        label: "URL Pembelian (khusus kursus berbayar — Gumroad, Payhip, Teachable, dsb.)"
        widget: "string"
        required: false
        hint: "Wajib diisi untuk kursus berbayar. Situs ini tidak bisa memproses pembayaran atau melindungi konten sendiri — lihat berkas templat untuk detail."
      - { name: "cover", label: "Gambar Sampul", widget: "image", required: false }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: true
      - name: "body"
        label: "Isi (materi pelajaran penuh untuk kursus GRATIS; hanya teaser/silabus publik untuk kursus BERBAYAR)"
        widget: "markdown"
        hint: "Untuk kursus gratis, Anda bisa menyematkan video YouTube dengan <iframe> — lihat contoh di _template-gratis.md. Untuk kursus berbayar, jangan pernah tempel materi asli di sini — akan terlihat oleh siapa saja."

  - name: "santai"
    label: "Santai Sejenak"
    folder: "src/content/santai"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Judul", widget: "string" }
      - { name: "description", label: "Deskripsi (dipakai di daftar)", widget: "text" }
      - { name: "date", label: "Tanggal", widget: "datetime" }
      - { name: "tags", label: "Tag", widget: "list", default: [] }
      - name: "draft"
        label: "Draf (belum tayang selagi dicentang)"
        widget: "boolean"
        default: false
      - { name: "body", label: "Isi", widget: "markdown" }

  - name: "books"
    label: "Books"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "year", label: "Year", widget: "number", value_type: "int" }
      - { name: "isbn", label: "ISBN", widget: "string", required: false }
      - { name: "cover", label: "Cover Image", widget: "image", required: false }
      - name: "formats"
        label: "Formats"
        widget: "select"
        multiple: true
        options: ["print", "pdf", "epub"]
        default: []
      - name: "purchaseLinks"
        label: "Where to Buy"
        widget: "list"
        default: []
        hint: "Add one entry per store/format — e.g. one for the print edition, one for the ebook."
        fields:
          - { name: "label", label: "Label (e.g. \"Print — Gramedia\" or \"Ebook — Google Play\")", widget: "string" }
          - { name: "url", label: "URL", widget: "string" }
      - { name: "quote", label: "Reader Quote", widget: "text", required: false }
      - { name: "body", label: "Notes (not shown on site)", widget: "markdown", required: false }
